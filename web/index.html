<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Station sign</title>
  <link rel="stylesheet" href="sign.css">
</head>
<body>
  <div id="stage">
    <header>
      <div id="clock">--:--:--</div>
      <div id="title">Next 3 Inbound and Outbound Trains</div>
      <div id="route-departs" hidden>Departs</div>
      <div id="pickers">
        <div id="station-picker">
          <input id="station-input" placeholder="Search station" role="combobox"
                 aria-controls="station-menu" autocomplete="off" spellcheck="false" aria-label="Station">
          <ul id="station-menu" role="listbox" hidden></ul>
        </div>
        <div id="platform-picker" hidden>
          <button id="platform-button" type="button" aria-haspopup="listbox"
                  aria-controls="platform-menu" aria-label="Platform" title="Platform">-</button>
          <ul id="platform-menu" role="listbox" hidden></ul>
        </div>
      </div>
    </header>

    <section id="inbound">
      <div class="section-head">
        <span class="name"></span>
        <span class="col-platform">Platform</span>
        <span class="col-departs">Departs</span>
      </div>
      <div class="rows"></div>
    </section>

    <section id="outbound">
      <div class="section-head">
        <span class="name"></span>
        <span class="col-platform">Platform</span>
        <span class="col-departs">Departs</span>
      </div>
      <div class="rows"></div>
    </section>

    <section id="route" hidden>
      <div class="route-body">
        <div class="route-row"></div>
        <div class="stops"></div>
        <img class="airtrain-logo" src="airtrain.png" alt="Airtrain" hidden>
      </div>
    </section>

    <div id="message"><div class="track"></div></div>
    <div id="no-services" hidden>No scheduled services from this platform</div>
    <footer id="status"></footer>
  </div>

  <!-- NGR (New Generation Rollingstock) pictogram; the cut-outs take the row colour. -->
  <template id="ngr-icon">
    <svg class="ngr" viewBox="57 55 251 343" aria-label="NGR train" role="img">
      <path class="body" d="M116 55H249A16 16 0 0 1 265 71V235A22 22 0 0 1 243 257H122A22 22 0 0 1 100 235V71A16 16 0 0 1 116 55Z"/>
      <rect class="cut" x="164" y="63" width="37" height="13" rx="6.5"/>
      <rect class="cut" x="122" y="90" width="121" height="64" rx="14"/>
      <circle class="cut" cx="133.5" cy="223" r="14"/>
      <circle class="cut" cx="231.5" cy="223" r="14"/>
      <rect class="body" x="148" y="252" width="12" height="20"/>
      <rect class="body" x="205" y="252" width="12" height="20"/>
      <rect class="body" x="110" y="268" width="145" height="8" rx="4"/>
      <rect class="body" x="127" y="273" width="17" height="11" rx="5"/>
      <rect class="body" x="221" y="273" width="17" height="11" rx="5"/>
      <text class="label" x="182.5" y="389" text-anchor="middle" textLength="250" lengthAdjust="spacingAndGlyphs">NGR</text>
    </svg>
  </template>
  <template id="three-car-icon">
    <svg class="three-car" viewBox="0 0 100 100" aria-label="3 car train" role="img">
      <rect class="body" x="2" y="2" width="96" height="96"/>
      <text class="cut" x="30" y="69" text-anchor="middle" font-size="52">3</text>
      <text class="cut" x="73" y="33" text-anchor="middle" font-size="26">C</text>
      <text class="cut" x="73" y="60" text-anchor="middle" font-size="26">A</text>
      <text class="cut" x="73" y="87" text-anchor="middle" font-size="26">R</text>
    </svg>
  </template>
  <template id="airport-icon">
    <svg class="airport-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="currentColor" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/>
    </svg>
  </template>
  <script src="sign.js"></script>
</body>
</html>
